<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sneakers Card</title>
     <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: hsla(319, 89%, 93%, 0.966);
      font-family: Arial, Helvetica, sans-serif;
      padding: 50px;
    }

    .product-card {
      background-color: #fff;
      width: 400px;
      margin: 0 auto;
      border-radius: 16px;
      padding: 24px;
      border: 1px solid #e6e0e0;
      box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.1);
    }

    .product-image {
      width: 100%;
      height: 210%;
      overflow: hidden;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    
    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-category {
      font-size: 14px;
      color: #a82b31;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    
    .product-title {
      font-size: 22px;
      font-weight: bold;
      color: #333;
      margin-bottom: 12px;
    }

    .product-description{
      font-size: 14px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e6e0e0;
    }

    .price-section {
      margin-bottom: 20px;
    }

    .price-section .price {
      font-size: 26px;
      font-weight: bold;
      color: #7c090e;
    }

    .price-section .original-price {
      font-size: 16px;
      color: #999;
      text-decoration: line-through;
      margin-left: 10px;
    }

    .size-options-wrapper {
      border: none;
    }

    .size-label-text {
      font-size: 14px;
      font-weight: bold;
      color: #333;
      margin-bottom: 12px;
    }

    .size-options {
      margin-bottom: 40px;
    }

    .size-options input[type="radio"] {
      display: none;
    }

    .size-options label {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 2px solid #ccc;
      text-align: center;
      line-height: 40px;
      margin-right: 8px;
      font-weight: bold;
      color: #2b282a;
      cursor: pointer;
      border-radius: 8px;
    }

    .size-options input[type="radio"]:checked + label {
      border-color: hsl(0, 10%, 56%);
      background-color: #755e5f;
      color: #fdfafa;
    }

    .color-options-wrapper {
      border: none;
    }

    .color-label-text {
      font-size: 14px;
      font-weight: bold;
      color: #333;
      margin-bottom: 12px;
    }

    .color-options {
      margin-bottom: 40px;
    }

    .color-options input[type="radio"] {
      display: none;
    }

    .color-options input[type="radio"] {
      display: none;
    }

    .color-options label {
      display: inline-block;
      width: 80px;
      height: 40px;
      border: 2px solid #ccc;
      text-align: center;
      line-height: 40px;
      margin-right: 8px;
      font-weight: bold;
      color: #2b282a;
      cursor: pointer;
      border-radius: 8px;
    }

    .color-options input[type="radio"]:checked + label {
      border-color: hsl(0, 10%, 56%);
      background-color: #755e5f;
      color: #fdfafa;
    }

    .buy-button, .buy-now {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background-color: #755e5f;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      margin-bottom: 12px;
      letter-spacing: 1.5px;
      transition: 0.3s ease;
    }
  </style>


</head>
<body>
    <article class="product-card">
        <figure class="product-image">
            <img src="images/bostanten-shoes.jpg" alt="Bostanten Shoes" width="300" height="300">
        </figure>

        <p class="product-category">MAGGY SHOES Bostanten</p>
        <h3 class="product-title">[Maggy shoes] Sneakers Wanita Mary Jane</h3>

        <p class="product-description"> Sepatu Ringan & Nyaman. Kualitas Terbaik dan 100% asli</p>

        <div class="price-section">
      <span class="price">IDR 219.999,00</span>
      <del class="original-price">IDR 488.000,00</del>
    </div>

    <form action="">
      <fieldset class="size-options-wrapper">

        <legend class="size-label-text">SIZE:</legend>
        <div class="size-options">

          <input type="radio" name="size" id="36" value="8">
          <label for="36">36</label>

          <input type="radio" name="size" id="37" value="8">
          <label for="37">37</label>

          <input type="radio" name="size" id="38" value="8">
          <label for="38">38</label>

          <input type="radio" name="size" id="39" value="8">
          <label for="39">39</label>
        </div>
      </fieldset>

      <fieldset class="color-options-wrapper">
        <legend class="color-label-text">COLOR:</legend>
        <div class="color-options">

            <input type="radio" name="color" id="pink" value="pink">
            <label for="pink">Pink</label>

            <input type="radio" name="color" id="grey" value="grey">
            <label for="grey"> Grey</label>

            <input type="radio" name="color" id="apricot" value="light apricot">
            <label for="apricot">Apricot</label>

           </div>
      </fieldset>
        

     <button class="buy-button" type="submit">Tambahkan ke Keranjang</button>
      <button class="buy-now" type="submit">Beli Sekarang</button>
    </form>





</body>
</html>
