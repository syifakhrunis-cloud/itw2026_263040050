<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Elemen Form</title>
</head>
<body>
    <h1>Contoh elemen-elemen form pada HTML</h1>

    <form>
        <label for="nama">Nama:
        <input type="text" name="nama" placeholder="Masukkan nama" id="nama">
        </label>
        <br>
        <label for="password">Password:
        <input type="password" name="password" id="password">
        </label>
        <br>
        <label for="email">Email:
            <input type="email"nname=email id="email"
        </label>
        <br>
        <label for="angka">angka:
            <input type="number" name="angka" id="angka" min="0" max="100">
            </label>
        <br>
        <label for="tanggal">Tanggal:
        <input type="date" name="tanggal" id="tanggal"
        </label>
        <br>
        <label for="warna">Pilih Warna:
            <input type="color" name="warna" id="warna">
        </label>
        <button type="submit">Kirim!</button>
    </form>
</body>
</html>
