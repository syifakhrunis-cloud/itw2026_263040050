<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    p {
      font-size: 20px;
      white-space: nowrap;
      width: 300px;
      background-color: rgb(67, 109, 122);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    h1 {
      font-size: 100px;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      text-shadow: 5px 5px 0 gray;
      text-decoration: underline;
      text-decoration-style: wavy;
      text-decoration-color: rgb(74, 107, 117);
      text-decoration-skip-ink: none;
    }
    </style>

</head>
<body>

    <h1>Hello, CSS!</h1>

    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Ab, expedita? Alias dicta excepturi iusto provident iste repellat quam molestiae omnis, assumenda cum voluptas nihil laboriosam libero adipisci at. Doloremque pariatur, voluptas, iste consequuntur reprehenderit nulla. </p>
</body>
</html>
