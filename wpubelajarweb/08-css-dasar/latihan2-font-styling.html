    <h1>Face the Fear</h1>
    <br>

    <blockquote>“You must do the thing you think you cannot do.”</blockquote>
    <p class="quote"><span>Confidence</span> rarely comes before action.
         It usually grows after you try something that once felt out of reach.
         Each time you do, the limit you imagined gets a little smaller. </p>

    <p class="credit">Eleanor Roosevelt</p>
