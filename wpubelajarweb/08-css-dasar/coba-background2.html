<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Background</title>
    <style>
        body{
            background-color: lightcyan;
            background-image: linear-gradient(to right, blue), lightblue;
            height: 100vh;    
        }


        .kotak1 {
            width: 300px;
            height: 300px;
            background-color: salmon;
            background-image: linear-gradient(to bottom, lightblue, salmon);
        }
        .kotak2 {
            width: 300px;
            height: 300px;
            background-color: salmon;
            background-image: radial-gradient( rgb(158, 213, 250), rgb(236, 129, 227));
        }
        .kotak3 {
            width: 300px;
            height: 300px;
            background-color: salmon;
            background-image: conic-gradient( rgb(248, 248, 114), hsl(135, 54%, 52%), #89ff89);
        }
    </style>
</head>
<body>
    <div class="kotak1"></div>
    <div class="kotak2"></div>
    <div class="kotak3"></div>
</body>
</html>
