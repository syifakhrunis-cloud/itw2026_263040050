<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Background</title>
    <style>
        body{
            background-color: rgb(177, 58, 117);
            background-image: linear-gradient(to right, blue), lightblue;
             height: 100vh;
        }


        .kotak {
            width: 200px;
            height: 200px;
            background-color: rgb(250, 154, 210);
           background-image: linear-gradient(to bottom, lightblue, salmon);
        }

          .kotak2 {
            width: 300px;
            height: 300px;
            background-color: salmon;
            background-image: radial-gradient( blue, red);
        }
        .kotak3 {
            width: 300px;
            height: 300px;
            background-color: salmon;
            background-image: conic-gradient( blue, red, green);
        }
    </style>
</head>
<body>
    <div class="kotak"></div>
    <div class="kotak2"></div>
    <div class="kotak3"></div>
</body>
</html>
